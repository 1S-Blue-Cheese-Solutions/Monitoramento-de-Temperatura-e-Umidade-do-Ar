<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./img/LogoBlueCheese.png" type="image/x-icon">
    <title>Registro - Blue Cheese</title>
</head>
<body>
    <main class="main-login">
        <header class="site-header">
            <div class="container nav">
            <a href="index.html#home" class="brand" aria-label="Blue Cheese - início">
                <img src="./img/LogoBlueCheese.png" alt="Logo Blue Cheese">
            </a>

            <nav class="nav-links" id="nav_links" aria-label="Navegação principal">
                <a href="index.html#home">Home</a>
                <a href="index.html#sobre">Sobre</a>
                <a href="index.html#como-funciona">Como funciona</a>
                <a href="index.html#simulador">Simulador financeiro</a>
                <a href="index.html#quem-somos">Quem somos</a>
            </nav>

            <a class="nav-cta" href="login.html">Monitoramento →</a>
            <button class="menu-toggle" id="menu_toggle" aria-label="Abrir menu" aria-expanded="false">☰</button>
            </div>
        </header>

        <div class="login-overlay">
            <section class="login-card registro-card">
                <div class="login-intro">
                    <img src="img/LogoBlueCheese.png">
                    <h1>Cadastre a sua empresa!</h1>
                    <p>Preencha os dados ao lado para começar a monitorar a maturação dos seus queijos.</p>
                </div>

                <div class="login-panel">
                    <a href="index.html" class="login-fechar">X</a>
                    <form class="login-form" autocomplete="on">
                        <div class="registro-linha">
                            <div class="registro-campo">
                                <label for="iempresa">Nome da empresa</label>
                                <div class="login-field">
                                    <input type="text" id="iempresa" placeholder="Queijaria Azul" maxlength="50">
                                </div>
                                <div class="login-msg" id="div_result_empresa"></div>
                            </div>
                            <div class="registro-campo">
                                <label for="icnpj">CNPJ</label>
                                <div class="login-field">
                                    <input type="text" id="icnpj" placeholder="Somente números" maxlength="14">
                                </div>
                                <div class="login-msg" id="div_result_cnpj"></div>
                            </div>
                        </div>

                        <div class="registro-linha">
                            <div class="registro-campo">
                                <label for="icliente">Nome do cliente</label>
                                <div class="login-field">
                                    <input type="text" id="icliente" placeholder="Seu nome" maxlength="50">
                                </div>
                                <div class="login-msg" id="div_result_cliente"></div>
                            </div>
                            <div class="registro-campo">
                                <label for="icpf">CPF</label>
                                <div class="login-field">
                                    <input type="text" id="icpf" placeholder="Somente números" maxlength="11">
                                </div>
                                <div class="login-msg" id="div_result_cpf"></div>
                            </div>
                        </div>

                        <div class="registro-linha">
                            <div class="registro-campo">
                                <label for="imail">Email</label>
                                <div class="login-field">
                                    <input type="email" id="imail" placeholder="voce@queijaria.com" maxlength="40">
                                </div>
                                <div class="login-msg" id="div_result_mail"></div>
                            </div>
                            <div class="registro-campo">
                                <label for="icelular">Celular</label>
                                <div class="login-field">
                                    <input type="tel" id="icelular" placeholder="11999999999" maxlength="11">
                                </div>
                                <div class="login-msg" id="div_result_celular"></div>
                            </div>
                        </div>

                        <label for="isenha">Senha</label>
                        <div class="login-field">
                            <img class="lock-icon" src="img/lockicon.svg">
                            <input type="password" id="isenha" placeholder="••••••••" maxlength="30">
                            <button type="button" class="login-ver" id="btn_ver" onclick="verSenha()">VER</button>
                        </div>
                        <div class="login-msg" id="div_result_senha"></div>

                        <button type="button" class="login-entrar" id="btn_registrar" onclick="registrar()">Registrar</button>
                    </form>

                    <p class="login-registro">Já possui conta? <a href="login.html">Entrar</a></p>
                </div>
            </section>
        </div>
    </main>

</body>
</html>
<script>
    function registrar() {
        // Implementar mais tarde o envio do cadastro
        let empresa = iempresa.value;
        let cnpj = icnpj.value;
        let cliente = icliente.value;
        let cpf = icpf.value;
        let email = imail.value;
        let celular = icelular.value;
        let flagError = false;

        if(empresa == '') {
            div_result_empresa.innerHTML=`Informe o nome da empresa`
            flagError = true;
        } else {
            div_result_empresa.innerHTML=``
        }

        if(cnpj.length != 14 || cnpj.includes("-") || cnpj.includes(".")) {
            div_result_cnpj.innerHTML=`CNPJ deve ter 14 números`
            flagError = true;
        } else {
            div_result_cnpj.innerHTML=``
        }

        if(cliente == '') {
            div_result_cliente.innerHTML=`Informe o seu nome`
            flagError = true;
        } else {
            div_result_cliente.innerHTML=``
        }

        if(cpf.length != 11 || cnpj.includes("-") || cnpj.includes(".")) {
            div_result_cpf.innerHTML=`CPF deve ter 11 números`
            flagError = true;
        } else {
            div_result_cpf.innerHTML=``
        }

        if(email.includes('@') && email.includes('.com')) {
            div_result_mail.innerHTML=``
        } else {
            div_result_mail.innerHTML=`Email deve conter @ e .com`
            flagError = true;
        }

        if(celular.length != 11) {
            div_result_celular.innerHTML=`Celular deve ter DDD + 9 números`
            flagError = true;
        } else {
            div_result_celular.innerHTML=``
        }

        // VALIDAÇÃO DA SENHA
        let senha = isenha.value;
        let tamanhoSenha = senha.length;
        let temMaiuscula = senha !== senha.toUpperCase();
        let temMinuscula = senha !== senha.toLowerCase();
        

        if(temMaiuscula && temMinuscula && tamanhoSenha >= 8) {
            div_result_senha.innerHTML=``
        } else if(temMaiuscula && temMinuscula) {
            div_result_senha.innerHTML=`Senha deve ter mais que 8 caracteres`
            flagError = true;
        } else if(temMaiuscula && tamanhoSenha >= 8) {
            div_result_senha.innerHTML=`Senha deve conter letra minuscula`
            flagError = true;
        }else if(temMinuscula && tamanhoSenha >= 8) {
            div_result_senha.innerHTML=`Senha deve conter letra maiscula`
            flagError = true;
        } else if(tamanhoSenha >= 8){
            div_result_senha.innerHTML=`Senha deve conter Maiuscula e minuscula`
            flagError = true;
        } else if(temMaiuscula) {
            div_result_senha.innerHTML=`Senha deve ter mais que 8 caracteres <br> e conter minuscula`
            flagError = true;
        } else if(temMinuscula) {
            div_result_senha.innerHTML=`Senha deve ter mais que 8 caracteres <br> e conter minuscula`
            flagError = true;
        } else if(tamanhoSenha == 0){
            div_result_senha.innerHTML=`Informe uma senha`
            flagError = true;
        }

        if(flagError){
            return
        }

        while(contador < senha.length) {
            if(senha.length == '@') {
                div_result_senha+=``
            }
        }
    }

    function verSenha() {
        if (isenha.type == 'password') {
            isenha.type = 'text';
            btn_ver.innerHTML = 'OCULTAR';
        } else {
            isenha.type = 'password';
            btn_ver.innerHTML = 'VER';
        }
    }
</script>
