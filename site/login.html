<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="styleLogin.css">
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
    <title>Login</title>
</head>
<body>
    <main>
        <header class="site-header">
            <div class="container nav">
            <a href="#home" class="brand" aria-label="Blue Cheese - início">
                <img src="./img/LogoBlueCheese.png" alt="Logo Blue Cheese">
            </a>

            <nav class="nav-links" id="navLinks" aria-label="Navegação principal">
                <a href="#home">Home</a>
                <a href="#sobre">Sobre</a>
                <a href="#como-funciona">Como funciona</a>
                <a href="#simulador">Simulador financeiro</a>
                <a href="#quem-somos">Quem somos</a>
            </nav>

            <a class="nav-cta" href="login.html">Monitoramento →</a>
            <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu" aria-expanded="false">☰</button>
            </div>
        </header>
        <section class="login">
            <div id="img">
                <img src="img/LogoBlueCheese.png" alt="Logo da empresa">
                <h1>A sua empresa de dados te espera!</h1>
                <p>Sua monitoração em tempo real melhor do que nunca, seus queijos cada vez mais seguros.</p>
            </div>
            <div id="form">
                
                <form autocomplete="on">
                    <div class="campo">
                        <span class="material-symbols-outlined">person</span>
                        <input type="email" name="mail" id="imail" placeholder="email:" autocomplete="email" required maxlength="30" oninput="email()">
                        <label for="ilogin"></label>
                    </div>
                    <div id="div_resultMail"></div>
                    <div class="campo">                        
                        <span class="material-symbols-outlined">vpn_key</span>
                        <input type="password" name="senha" id="isenha" placeholder="Senha:" autocomplete="current-password" required minlength="8" maxlength="20" oninput="mostrar()">
                    </div>
                    <div id="div_resultSenha"></div>
                    <button onclick="entrar()" id="entrar">Entrar</button>
                    <button onclick="recuperar()" id="recuperar">Esqueci a senha <span class="material-symbols-outlined">mail</span></button>
                    <span id="registro">Ainda não tem uma conta? <a href="#">Cadastre-se</a></span>
                </form>
            </div>
        </section>
    </main>
    
</body>
</html>
<script>
    function email() {
        let email = imail.value;

        if(email.includes('@') && email.includes('.com')) {
            div_resultMail.innerHTML=``
        } else {
            div_resultMail.innerHTML=`Email deve conter @ e .com`
        }
    }

    function mostrar() {
        let senha = isenha.value;
        let tamanhoSenha = senha.length;
        let temMaiuscula = senha !== senha.toUpperCase();
        let temMinuscula = senha !== senha.toLowerCase();
        
        let criterios = 0;

        if(tamanhoSenha >= 8){
            criterios = criterios + 1;
        } 

        if(temMaiuscula) {
            criterios = criterios + 1;
        }

        if(temMinuscula) {
            criterios = criterios + 1;
        }

        if(criterios == 1){
            div_resultSenha.innerHTML=`Senha Fraca`
        }else if(criterios == 2) {
            div_resultSenha.innerHTML=`Senha Média`
        }else if(criterios == 3){
            div_resultSenha.innerHTML=``
        }
    }
</script>
