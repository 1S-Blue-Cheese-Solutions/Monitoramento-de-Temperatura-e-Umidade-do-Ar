<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./img/LogoBlueCheese.png" type="image/x-icon">
    <title>Login - Blue Cheese</title>
</head>
<body>
    <main class="main-login">
        <header class="site-header">
            <div class="container nav">
            <a href="index.html#home" class="brand" aria-label="Blue Cheese - início">
                <img src="./img/LogoBlueCheese.png" alt="Logo Blue Cheese">
            </a>

            <nav class="nav-links" id="navLinks" aria-label="Navegação principal">
                <a href="index.html#home">Home</a>
                <a href="index.html#sobre">Sobre</a>
                <a href="index.html#como-funciona">Como funciona</a>
                <a href="index.html#simulador">Simulador financeiro</a>
                <a href="index.html#quem-somos">Quem somos</a>
            </nav>

            <a class="nav-cta" href="login.html">Monitoramento →</a>
            <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu" aria-expanded="false">☰</button>
            </div>
        </header>

        <div class="login-overlay">
            <section class="login-card">
                <div class="login-intro">
                    <img src="img/LogoBlueCheese.png">
                    <h1>O monitoramento que sua empresa precisa!</h1>
                    <p>Monitoramento em tempo real para uma maturação mais segura, precisa e eficiente dos seus queijos.</p>
                </div>

                <div class="login-panel">
                    <form class="login-form" autocomplete="on">
                        <label for="imail">Email</label>
                        <div class="login-field">
                            <img class="mail-icon" src="img/mailicon.svg">
                            <input type="email" name="mail" id="imail" placeholder="voce@queijaria.com" autocomplete="email" required maxlength="40" oninput="email()">
                        </div>
                        <div class="login-msg" id="div_resultMail"></div>

                        <label for="isenha">Senha</label>
                        <div class="login-field">
                            <img class="lock-icon" src="img/lockicon.svg">
                            <input type="password" name="senha" id="isenha" placeholder="••••••••" required minlength="8" maxlength="30" oninput="mostrar()">
                            <button type="button" class="login-ver" id="btnVer" onclick="verSenha()">VER</button>
                        </div>
                        <div class="login-msg" id="div_resultSenha"></div>

                        <button type="submit" class="login-entrar" id="entrar">Entrar</button>
                        <!-- <a href="#" class="login-esqueci">Esqueci minha senha</a> -->
                    </form>

                    <p class="login-registro">Não possui conta? <a href="#">Registrar-se</a></p>
                </div>
            </section>
        </div>
    </main>

</body>
</html>
<script>
    function entrar(){
        // Implementar mais tarde a entrada para o dashboard
    }

    function verSenha() {
        if (isenha.type == 'password') {
            isenha.type = 'text';
            btnVer.innerHTML = 'OCULTAR';
        } else {
            isenha.type = 'password';
            btnVer.innerHTML = 'VER';
        }
    }

    function email() {
        let email = imail.value;

        if(email.includes('@') && email.includes('.com')) {
            div_resultMail.innerHTML=``
        } else {
            div_resultMail.innerHTML=`Email deve conter @ e .com`
        }
    }

    function mostrar() {
        let senha = isenha.value;
        let tamanhoSenha = senha.length;
        let temMaiuscula = senha !== senha.toUpperCase();
        let temMinuscula = senha !== senha.toLowerCase();

        let criterios = 0;

        if(tamanhoSenha >= 8){
            criterios = criterios + 1;
        }

        if(temMaiuscula) {
            criterios = criterios + 1;
        }

        if(temMinuscula) {
            criterios = criterios + 1;
        }

        if(criterios == 1){
            div_resultSenha.innerHTML=`Senha Fraca`
        }else if(criterios == 2) {
            div_resultSenha.innerHTML=`Senha Média`
        }else if(criterios == 3){
            div_resultSenha.innerHTML=``
        }
    }
</script>
