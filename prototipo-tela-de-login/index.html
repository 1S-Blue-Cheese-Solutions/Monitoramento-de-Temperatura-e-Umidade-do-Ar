<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="estilos/media-query.css">
    <title>Login</title>
</head>
<body>
    <main>
        <header>
            <img src="favicon.png" alt="">
            <nav>
                <a href="#" id="monitoramento">Acessar monitoramento</a>                
                <a href="#">Quem Somos</a>
                <a href="#">Simulador Financeiro</a>
                <a href="#">Problema</a>
                <a href="#">Objetivo</a>
                <a href="#"><b>Home</b></a>
            </nav>
        </header>
        <section id="login">
            <div id="img">
                <img src="favicon.png" alt="Logo da empresa">
                <h1>A sua empresa de dados te espera!</h1>
                <p>Sua monitoração em tempo real melhor do que nunca, seus queijos cada vez mais seguros.</p>
            </div>
            <div id="form">
                
                <form autocomplete="on">
                    <div class="campo">
                        <span class="material-symbols-outlined">person</span>
                        <input type="email" name="mail" id="imail" placeholder="email:" autocomplete="email" required maxlength="30">
                        <label for="ilogin"></label>
                    </div>
                    <div class="campo">                        
                        <span class="material-symbols-outlined">vpn_key</span>
                        <input type="password" name="senha" id="isenha" placeholder="Senha:" autocomplete="current-password" required minlength="8" maxlength="20">
                        <label for="isenha"></label>
                    </div>
                    <button onclick="entrar()" id="entrar">Entrar</button>
                    <button onclick="recuperar()" id="recuperar">Esqueci a senha <span class="material-symbols-outlined">mail</span></button>
                    <span>Ainda não tem uma conta? <a href="#">Cadastre-se</a></span>
                </form>
            </div>
        </section>
    </main>
    
</body>
</html>
