<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Pacote de sensores
    <select id="select_pacote">
        <option selected disabled >Insira uma opção</option>
        <option value = "1">Pacote 10 sensores</option>
        <option value = "2">Pacote 20 sensores</option>
        <option value = "3">Pacote 30 sensores</option>
    </select>

    <button onclick="escolher()">Escolher</button>
    
    <div id="div_exbCalc"></div>
</body>
</html>

<script>
    
    let unidSensor = 11;
    


    function escolher(){
        let pacote = select_pacote.value;
        
        if(pacote == "1"){
            let pacote10 = unidSensor * 10;
            let pacote10Format = pacote10.toFixed(2,2);

            div_exbCalc.innerHTML = `Você optu pelo sistema com 10 sensores, seu gasto com sensores será de ${pacote10Format}R$`
        } if(pacote == "2"){
        
            let pacote20 = unidSensor * 20;
            let pacote20Format = pacote20.toFixed(2,2);

            div_exbCalc.innerHTML = `Você optu pelo sistema com 20 sensores, seu gasto com sensores será de ${pacote20Format}R$`
        }if (pacote == "3") {
            let pacote30 = unidSensor * 30;
            let pacote30Format = pacote30.toFixed(2,2);

            div_exbCalc.innerHTML = `Você optu pelo sistema com 30 sensores, seu gasto com sensores será de ${pacote30Format}R$`                   
        }
    }
</script>
